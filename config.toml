# Shared settings for all bots. Every [[bots]] entry at the bottom can override any of these keys.

[market]
exchange = "binance"          # any ccxt exchange id; tested with bitvavo and binance
timeframe = "4h"
operator_id = 1               # Bitvavo requires an integer "operatorId" on every order; ignored on binance

[costs]
# Binance spot fee at the base tier (VIP 0) is 0.10% maker / 0.10% taker (0.075% if paying with BNB).
fee = 0.0010                  # taker fee (market orders)
slippage = 0.0005
maker_fee = 0.0010            # fee for limit orders that rest in the order book

[orders]
# "limit": post a post-only limit order at the best bid/ask, wait limit_timeout_s, then send whatever is
# left as a market order. Emergency exits (max drawdown) always use market orders.
order_type = "limit"
limit_timeout_s = 90

[risk]
position_fraction = 0.95      # fraction of the bot's equity to deploy when the strategy is long
# Volatility sizing: each new trade's size = min(1, vol_target / the coin's Rogers-Satchell OHLC volatility over
# the last vol_lookback_days), fixed until the exit. Calmer coins get a full position, wild ones less. 0 = off.
vol_target = 0.5
vol_lookback_days = 30
max_position_quote = 0.0      # optional hard cap on position size per bot in EUR; 0 = off (compounds with equity)
daily_loss_limit_pct = 0.05   # block new buys after a 5% loss since start of the UTC day
max_drawdown_pct = 0.25       # flatten and halt the bot after a 25% drop from peak equity
max_trades_per_day = 6        # guards against runaway loops
min_order_quote = 10.0        # Bitvavo minimum order is EUR 5

[live]
mode = "live"                 # paper | live  (testnet only exists for binance)
# Each bot's own budget. A bot only trades this money plus the coins it buys with it; everything else on the
# account (your personal crypto and EUR, and the other bots' money) is ignored. Tracked per bot in
# state/<name>/ledger_<mode>.json. In live mode the account needs (number of bots x budget) EUR free.
budget_quote = 480.0
state_dir = "state"           # each bot gets its own subfolder: state/<name>/
data_dir = "data"

# One bot per coin, all with the same strategy (no cherry-picking per coin). Params are the walk-forward choice
# for the latest window on bitvavo 4h (re-check every ~6 months with `python -m traderbot walkforward`).

[[bots]]
name = "btc"
symbol = "BTC/EUR"
strategy = "donchian_breakout"
params = { entry = 100, exit = 50 }

[[bots]]
name = "eth"
symbol = "ETH/EUR"
strategy = "donchian_breakout"
params = { entry = 100, exit = 10 }

[[bots]]
name = "sol"
symbol = "SOL/EUR"
strategy = "donchian_breakout"
params = { entry = 100, exit = 20 }

[[bots]]
name = "xrp"
symbol = "XRP/EUR"
strategy = "donchian_breakout"
params = { entry = 100, exit = 20 }

[[bots]]
name = "ada"
symbol = "ADA/EUR"
strategy = "donchian_breakout"
params = { entry = 100, exit = 20 }
